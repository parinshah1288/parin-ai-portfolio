<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1140" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Explainable AI: the trust test</title><desc id="desc">Visual guide to AI transparency, evaluation, and evidence verification.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102942"/><stop offset="1" stop-color="#0c5559"/></linearGradient></defs><rect width="900" height="1140" rx="20" fill="url(#bg)"/><text x="32" y="56" font-size="44" fill="#fff" font-weight="700">EXPLAINABLE AI</text><text x="34" y="91" font-size="25" fill="#8eeada" font-weight="700">How do we know when to trust an AI answer?</text><rect x="28" y="122" width="235" height="132" rx="14" fill="#254c68"/><text x="43" y="156" font-size="23" fill="#fff" font-weight="700">User question</text><text x="43" y="184" font-size="17" fill="#e0edf5" font-weight="500">Does the warranty</text><text x="43" y="207" font-size="17" fill="#e0edf5" font-weight="500">cover water damage?</text><rect x="333" y="122" width="235" height="132" rx="14" fill="#13766e"/><text x="348" y="156" font-size="23" fill="#fff" font-weight="700">AI model</text><text x="348" y="184" font-size="17" fill="#e0edf5" font-weight="500">Complex internal</text><text x="348" y="207" font-size="17" fill="#e0edf5" font-weight="500">representations</text><rect x="638" y="122" width="234" height="132" rx="14" fill="#254c68"/><text x="653" y="156" font-size="23" fill="#fff" font-weight="700">AI answer</text><text x="653" y="184" font-size="17" fill="#e0edf5" font-weight="500">Sounds convincing.</text><text x="653" y="207" font-size="17" fill="#e0edf5" font-weight="500">But is it true?</text><text x="280" y="191" font-size="42" fill="#8eeada" font-weight="700">→</text><text x="585" y="191" font-size="42" fill="#8eeada" font-weight="700">→</text><text x="30" y="295" font-size="25" fill="#8eeada" font-weight="700">01  FOUR CHALLENGES</text><rect x="28" y="312" width="204" height="124" rx="14" fill="#24435e"/><text x="43" y="346" font-size="23" fill="#fff" font-weight="700">Complexity</text><text x="43" y="374" font-size="17" fill="#e0edf5" font-weight="500">Distributed</text><text x="43" y="397" font-size="17" fill="#e0edf5" font-weight="500">internal logic</text><rect x="241" y="312" width="204" height="124" rx="14" fill="#24435e"/><text x="256" y="346" font-size="23" fill="#fff" font-weight="700">Opacity</text><text x="256" y="374" font-size="17" fill="#e0edf5" font-weight="500">Explanations</text><text x="256" y="397" font-size="17" fill="#e0edf5" font-weight="500">may mislead</text><rect x="454" y="312" width="204" height="124" rx="14" fill="#24435e"/><text x="469" y="346" font-size="23" fill="#fff" font-weight="700">Bias</text><text x="469" y="374" font-size="17" fill="#e0edf5" font-weight="500">Uneven data</text><text x="469" y="397" font-size="17" fill="#e0edf5" font-weight="500">and error rates</text><rect x="667" y="312" width="205" height="124" rx="14" fill="#24435e"/><text x="682" y="346" font-size="23" fill="#fff" font-weight="700">Accuracy</text><text x="682" y="374" font-size="17" fill="#e0edf5" font-weight="500">Fluent but</text><text x="682" y="397" font-size="17" fill="#e0edf5" font-weight="500">unsupported</text><text x="30" y="477" font-size="25" fill="#8eeada" font-weight="700">02  THREE PILLARS OF TRUST</text><rect x="28" y="494" width="274" height="120" rx="14" fill="#087d83"/><text x="43" y="528" font-size="23" fill="#fff" font-weight="700">Explainability</text><text x="43" y="556" font-size="17" fill="#e0edf5" font-weight="500">Why this answer?</text><rect x="313" y="494" width="274" height="120" rx="14" fill="#9a6519"/><text x="328" y="528" font-size="23" fill="#fff" font-weight="700">Validation</text><text x="328" y="556" font-size="17" fill="#e0edf5" font-weight="500">Does it hold up?</text><rect x="598" y="494" width="274" height="120" rx="14" fill="#a6415c"/><text x="613" y="528" font-size="23" fill="#fff" font-weight="700">Metrics</text><text x="613" y="556" font-size="17" fill="#e0edf5" font-weight="500">How often does it work?</text><text x="30" y="654" font-size="25" fill="#8eeada" font-weight="700">03  VERIFY AGAINST EVIDENCE</text><rect x="28" y="672" width="396" height="105" rx="14" fill="#963e51"/><text x="43" y="706" font-size="23" fill="#fff" font-weight="700">✕ AI claim</text><text x="43" y="734" font-size="17" fill="#e0edf5" font-weight="500">Water damage is covered.</text><rect x="476" y="672" width="396" height="105" rx="14" fill="#15765d"/><text x="491" y="706" font-size="23" fill="#fff" font-weight="700">✓ Source policy</text><text x="491" y="734" font-size="17" fill="#e0edf5" font-weight="500">Water damage is excluded.</text><text x="432" y="735" font-size="35" fill="#fff" font-weight="700">≠</text><text x="30" y="818" font-size="25" fill="#8eeada" font-weight="700">04  INDUSTRY APPROACHES</text><rect x="28" y="835" width="204" height="115" rx="14" fill="#23536a"/><text x="43" y="869" font-size="23" fill="#fff" font-weight="700">OpenAI</text><text x="43" y="897" font-size="17" fill="#e0edf5" font-weight="500">Sparse features</text><text x="43" y="920" font-size="17" fill="#e0edf5" font-weight="500">and circuits</text><rect x="241" y="835" width="204" height="115" rx="14" fill="#87502d"/><text x="256" y="869" font-size="23" fill="#fff" font-weight="700">Anthropic</text><text x="256" y="897" font-size="17" fill="#e0edf5" font-weight="500">Attribution</text><text x="256" y="920" font-size="17" fill="#e0edf5" font-weight="500">graphs</text><rect x="454" y="835" width="204" height="115" rx="14" fill="#285e95"/><text x="469" y="869" font-size="23" fill="#fff" font-weight="700">Google</text><text x="469" y="897" font-size="17" fill="#e0edf5" font-weight="500">Gemma Scope</text><text x="469" y="920" font-size="17" fill="#e0edf5" font-weight="500">research tools</text><rect x="667" y="835" width="205" height="115" rx="14" fill="#665098"/><text x="682" y="869" font-size="23" fill="#fff" font-weight="700">Meta</text><text x="682" y="897" font-size="17" fill="#e0edf5" font-weight="500">Llama model</text><text x="682" y="920" font-size="17" fill="#e0edf5" font-weight="500">cards</text><text x="30" y="990" font-size="25" fill="#8eeada" font-weight="700">05  CONTINUOUS AUDIT LOOP</text><rect x="28" y="1007" width="844" height="54" rx="14" fill="#0b8079"/><text x="55" y="1042" font-size="29" fill="#fff" font-weight="700">Evaluate   →   Inspect   →   Improve   →   Monitor</text><text x="34" y="1107" font-size="25" fill="#f6dc91" font-weight="700">An explanation is not proof. Verify performance.</text></svg>